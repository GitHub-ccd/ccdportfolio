<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="blueGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#090d16"/>
  <circle cx="600" cy="300" r="380" fill="url(#blueGlow)"/>

  <!-- Top Title Header -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="220" height="24" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="0.8"/>
    <text x="12" y="16" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">VALIDATION ARCHITECTURE</text>
    <text x="0" y="54" font-size="26" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">The 3-Stage Deterministic Verification Pipeline</text>
    <text x="0" y="78" font-size="14" fill="#94a3b8">How 50 lines of Python (check_evidence_support) filter hallucinations without an LLM judge</text>
  </g>

  <!-- Left: Raw Input Observation -->
  <g transform="translate(60, 150)" filter="url(#boxShadow)">
    <rect width="210" height="340" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <rect x="16" y="16" width="100" height="20" rx="4" fill="#1e293b"/>
    <text x="24" y="30" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">RAW INPUT</text>
    <text x="16" y="60" font-size="15" font-weight="700" fill="#f1f5f9">Extracted Candidate</text>
    <text x="16" y="80" font-size="11" fill="#64748b">Tuple from LLM JSON:</text>
    
    <g transform="translate(16, 95)" font-size="11" font-family="monospace">
      <rect width="178" height="225" rx="6" fill="#090d16" stroke="#1e293b"/>
      <text x="10" y="24" fill="#38bdf8">entity_name:</text>
      <text x="10" y="40" fill="#e2e8f0">"Glenesk"</text>
      <text x="10" y="66" fill="#38bdf8">attribute:</text>
      <text x="10" y="82" fill="#e2e8f0">"heaters"</text>
      <text x="10" y="108" fill="#38bdf8">value:</text>
      <text x="10" y="124" fill="#fbbf24">"electric heaters</text>
      <text x="10" y="140" fill="#fbbf24"> in deluxe rooms"</text>
      <text x="10" y="166" fill="#38bdf8">evidence:</text>
      <text x="10" y="182" fill="#94a3b8">"city is known as</text>
      <text x="10" y="198" fill="#94a3b8"> Little England..."</text>
    </g>
  </g>

  <!-- Arrow from Input to Stage 1 -->
  <path d="M 270 320 L 315 320" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polygon points="315,315 325,320 315,325" fill="#38bdf8"/>

  <!-- Three Sequential Stages (Horizontal Flow) -->
  
  <!-- STAGE 1: Verbatim Substring Check -->
  <g transform="translate(330, 150)" filter="url(#boxShadow)">
    <rect width="230" height="340" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="20" rx="4" fill="#0c4a6e"/>
    <text x="24" y="30" font-size="10" font-weight="700" fill="#38bdf8">STAGE 1</text>
    <text x="16" y="58" font-size="15" font-weight="700" fill="#f1f5f9">Verbatim Quote</text>
    <text x="16" y="78" font-size="12" fill="#94a3b8">Is quote on the page?</text>

    <!-- Code Snippet -->
    <rect x="16" y="95" width="198" height="65" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="24" y="120" font-size="11" font-family="monospace" fill="#38bdf8">if norm_evidence</text>
    <text x="44" y="140" font-size="11" font-family="monospace" fill="#38bdf8">not in norm_page:</text>

    <!-- Failure Exit Box -->
    <rect x="16" y="180" width="198" height="65" rx="6" fill="#450a0a" stroke="#b91c1c" stroke-width="1"/>
    <text x="24" y="202" font-size="11" font-weight="700" fill="#f87171">DROP REASON:</text>
    <text x="24" y="222" font-size="11" font-family="monospace" fill="#fecaca">evidence_not_in_page</text>
    <text x="24" y="236" font-size="10" fill="#fca5a5">Catches pure hallucinations</text>

    <!-- Pass indicator -->
    <g transform="translate(16, 265)">
      <rect width="198" height="55" rx="6" fill="#064e3b" stroke="#059669"/>
      <text x="12" y="24" font-size="11" font-weight="700" fill="#34d399">✓ Quote Exists on Page</text>
      <text x="12" y="42" font-size="10" fill="#a7f3d0">Advances to Stage 2 →</text>
    </g>
  </g>

  <!-- Arrow from Stage 1 to Stage 2 -->
  <polygon points="565,315 575,320 565,325" fill="#34d399"/>
  <line x1="560" y1="320" x2="575" y2="320" stroke="#34d399" stroke-width="2.5"/>

  <!-- STAGE 2: Entity Grounding Check -->
  <g transform="translate(585, 150)" filter="url(#boxShadow)">
    <rect width="230" height="340" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="20" rx="4" fill="#0c4a6e"/>
    <text x="24" y="30" font-size="10" font-weight="700" fill="#38bdf8">STAGE 2</text>
    <text x="16" y="58" font-size="15" font-weight="700" fill="#f1f5f9">Entity Grounding</text>
    <text x="16" y="78" font-size="12" fill="#94a3b8">Hotel named in quote?</text>

    <!-- Code Snippet -->
    <rect x="16" y="95" width="198" height="65" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="24" y="120" font-size="11" font-family="monospace" fill="#38bdf8">if not all(t in quote</text>
    <text x="44" y="140" font-size="11" font-family="monospace" fill="#38bdf8">for t in ent_tokens):</text>

    <!-- Failure Exit Box -->
    <rect x="16" y="180" width="198" height="65" rx="6" fill="#450a0a" stroke="#b91c1c" stroke-width="1"/>
    <text x="24" y="202" font-size="11" font-weight="700" fill="#f87171">DROP REASON:</text>
    <text x="24" y="222" font-size="11" font-family="monospace" fill="#fecaca">entity_not_in_evidence</text>
    <text x="24" y="236" font-size="10" fill="#fca5a5">Catches wrong-owner facts</text>

    <!-- Pass indicator -->
    <g transform="translate(16, 265)">
      <rect width="198" height="55" rx="6" fill="#064e3b" stroke="#059669"/>
      <text x="12" y="24" font-size="11" font-weight="700" fill="#34d399">✓ Entity Validated / Null</text>
      <text x="12" y="42" font-size="10" fill="#a7f3d0">Advances to Stage 3 →</text>
    </g>
  </g>

  <!-- Arrow from Stage 2 to Stage 3 -->
  <polygon points="820,315 830,320 820,325" fill="#34d399"/>
  <line x1="815" y1="320" x2="830" y2="320" stroke="#34d399" stroke-width="2.5"/>

  <!-- STAGE 3: Content-Word Overlap Check (THE HERO GUARD) -->
  <g transform="translate(840, 150)" filter="url(#boxShadow)">
    <rect width="295" height="340" rx="12" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <rect x="16" y="16" width="160" height="20" rx="4" fill="#064e3b"/>
    <text x="24" y="30" font-size="10" font-weight="700" fill="#34d399">STAGE 3 · THE HERO GUARD</text>
    <text x="16" y="58" font-size="15" font-weight="700" fill="#f1f5f9">Content Word Overlap</text>
    <text x="16" y="78" font-size="12" fill="#94a3b8">Do words in value match quote?</text>

    <!-- Code Snippet -->
    <rect x="16" y="95" width="263" height="65" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="24" y="120" font-size="11" font-family="monospace" fill="#38bdf8">if overlap &lt; min_overlap:</text>
    <text x="36" y="140" font-size="11" font-family="monospace" fill="#fbbf24"># min_overlap = 0.5 (50%)</text>

    <!-- Caught Defect Callout -->
    <rect x="16" y="172" width="263" height="78" rx="6" fill="#450a0a" stroke="#b91c1c" stroke-width="1"/>
    <text x="24" y="192" font-size="11" font-weight="700" fill="#f87171">CATCHES PROMPT LEAKS:</text>
    <text x="24" y="210" font-size="10.5" fill="#fecaca">"electric heaters" vs "Little England"</text>
    <text x="24" y="226" font-size="10" font-family="monospace" fill="#fca5a5">Overlap: 0% &lt; 50% → DROPPED!</text>
    <text x="24" y="240" font-size="9.5" fill="#fda4af">Reason: value_not_in_evidence</text>

    <!-- Final Kept Status -->
    <g transform="translate(16, 262)">
      <rect width="263" height="60" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="16" y="24" font-size="13" font-weight="800" fill="#34d399">✓ VERIFIED FACT KEPT</text>
      <text x="16" y="44" font-size="11" fill="#a7f3d0">Stored in SQLite with full lineage audit</text>
    </g>
  </g>

  <!-- Bottom Global Takeaway Banner -->
  <g transform="translate(60, 520)">
    <rect width="1075" height="110" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="28" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">WHY DETERMINISTIC CODE BEATS BIGGER MODELS</text>
    <text x="24" y="52" font-size="13" font-weight="600" fill="#f8fafc">
      Bigger models cannot audit their own hallucinations because prompt-copied text looks syntactically authentic.
    </text>
    <text x="24" y="74" font-size="12" fill="#94a3b8">
      A simple 50-line Python validator enforcing string presence and word overlap caught 87% of 3B errors and 72% of 14B errors.
    </text>
    <text x="24" y="94" font-size="12" fill="#34d399">
      Combined with abstract prompt rules (v3), verified facts increased by +30.8% with zero entity cross-wirings.
    </text>
  </g>
</svg>