<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="treeGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#090d16"/>
  <circle cx="600" cy="300" r="400" fill="url(#treeGlow)"/>

  <!-- Top Title Header -->
  <g transform="translate(60, 38)">
    <rect x="0" y="0" width="220" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <text x="12" y="16" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1.5">ARCHITECTURE GUIDE</text>
    <text x="0" y="52" font-size="25" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Developer Decision Tree: Local vs. Rent vs. Cloud APIs</text>
    <text x="0" y="74" font-size="13.5" fill="#94a3b8">A practical navigation framework for personal agentic AI projects in late 2026</text>
  </g>

  <!-- 
       Decision Flow Layout:
       Level 1 (Top Root): Programmatic Code Access Needed? (Y=120)
       Level 2: Strict Data Sovereignty Required? (Y=210)
       Level 3: Workload & Runtime Patterns (Y=310)
       Level 4 (Outcomes / Recommendations): 3 Main Endpoints (Y=440 to 600)
  -->

  <!-- LEVEL 1: Root Node -->
  <g transform="translate(420, 115)" filter="url(#nodeShadow)">
    <rect width="360" height="48" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="180" y="29" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">Do you need programmatic LLM calls from code?</text>
  </g>

  <!-- Arrow Down to Level 2 -->
  <line x1="600" y1="163" x2="600" y2="195" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="596,195 600,202 604,195" fill="#38bdf8"/>

  <!-- LEVEL 2: Data Sovereignty Node -->
  <g transform="translate(400, 202)" filter="url(#nodeShadow)">
    <rect width="400" height="52" rx="8" fill="#111827" stroke="#6366f1" stroke-width="1.5"/>
    <text x="200" y="24" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">Is your data strictly confidential or sovereign?</text>
    <text x="200" y="42" font-size="11" fill="#94a3b8" text-anchor="middle">(Must never touch external cloud servers or third parties)</text>
  </g>

  <!-- Branch Left: YES (Data Sovereignty) -->
  <path d="M 400 228 L 200 228 L 200 285" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="196,285 200,292 204,285" fill="#f59e0b"/>
  <rect x="260" y="216" width="60" height="20" rx="4" fill="#451a03"/>
  <text x="290" y="230" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">YES</text>

  <!-- Branch Right: NO (Standard / Public Data) -->
  <path d="M 800 228 L 840 228 L 840 285" fill="none" stroke="#10b981" stroke-width="2"/>
  <polygon points="836,285 840,292 844,285" fill="#10b981"/>
  <rect x="805" y="216" width="60" height="20" rx="4" fill="#064e3b"/>
  <text x="835" y="230" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">NO</text>

  <!-- LEVEL 3 LEFT: Hardware Check (for Private Data) -->
  <g transform="translate(50, 292)" filter="url(#nodeShadow)">
    <rect width="300" height="54" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="150" y="24" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Do you own modern GPU hardware?</text>
    <text x="150" y="42" font-size="11" fill="#94a3b8" text-anchor="middle">(≥ 12 GB VRAM for 8B models without PCIe spill)</text>
  </g>

  <!-- LEVEL 3 RIGHT: Workload Cadence (for Public Data) -->
  <g transform="translate(680, 292)" filter="url(#nodeShadow)">
    <rect width="320" height="54" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.2"/>
    <text x="160" y="24" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">What is your monthly execution pattern?</text>
    <text x="160" y="42" font-size="11" fill="#94a3b8" text-anchor="middle">Intermittent batch (&lt;50 hrs/mo) vs. live low-latency</text>
  </g>

  <!-- Sub-branch arrows to Endpoints -->
  <!-- Left Hardware -> Endpoint 1 (Local) -->
  <path d="M 120 346 L 120 395" fill="none" stroke="#34d399" stroke-width="1.8"/>
  <polygon points="116,395 120,402 124,395" fill="#34d399"/>
  <text x="135" y="375" font-size="10.5" font-weight="700" fill="#34d399">YES (Own GPU)</text>

  <!-- Left Hardware -> Endpoint 2 (Buy Rig) -->
  <path d="M 280 346 L 280 395" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
  <polygon points="276,395 280,402 284,395" fill="#f59e0b"/>
  <text x="295" y="375" font-size="10.5" font-weight="700" fill="#fbbf24">NO (Buy Rig)</text>

  <!-- Right Workload -> Endpoint 3 (Rent Cloud GPU) -->
  <path d="M 760 346 L 760 395" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="756,395 760,402 764,395" fill="#38bdf8"/>
  <text x="635" y="375" font-size="10.5" font-weight="700" fill="#38bdf8">INTERMITTENT BATCH</text>

  <!-- Right Workload -> Endpoint 4 (Metered Serverless API) -->
  <path d="M 920 346 L 920 395" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
  <polygon points="916,395 920,402 924,395" fill="#a78bfa"/>
  <text x="935" y="375" font-size="10.5" font-weight="700" fill="#c084fc">LIVE API REQUESTS</text>

  <!-- THE FOUR OUTCOME CARDS (Level 4, Y=402 to 590) -->

  <!-- CARD 1: Local Ollama -->
  <g transform="translate(40, 402)" filter="url(#nodeShadow)">
    <rect width="180" height="215" rx="10" fill="#042f2e" stroke="#10b981" stroke-width="1.2"/>
    <rect x="12" y="12" width="75" height="18" rx="3" fill="#065f46"/>
    <text x="18" y="25" font-size="9.5" font-weight="700" fill="#34d399">RECOMMENDED</text>
    <text x="12" y="52" font-size="15" font-weight="800" fill="#f0fdf4">Run Local Ollama</text>
    <text x="12" y="70" font-size="11" fill="#a7f3d0">100% Private &amp; Zero Cost</text>
    <line x1="12" y1="80" x2="168" y2="80" stroke="#059669" stroke-width="0.8"/>
    <text x="12" y="100" font-size="10.5" fill="#e2e8f0">• Best for 8B models</text>
    <text x="12" y="118" font-size="10.5" fill="#e2e8f0">• No recurring fees</text>
    <text x="12" y="136" font-size="10.5" fill="#e2e8f0">• Complete sovereignty</text>
    <text x="12" y="156" font-size="10" fill="#fbbf24">⚠ Watch VRAM limits:</text>
    <text x="12" y="172" font-size="9.5" fill="#fde68a">6GB spills to DDR4 RAM</text>
    <text x="12" y="186" font-size="9.5" fill="#fde68a">causing 8.8× latency drop</text>
  </g>

  <!-- CARD 2: Buy Dedicated Rig -->
  <g transform="translate(235, 402)" filter="url(#nodeShadow)">
    <rect width="180" height="215" rx="10" fill="#1c1917" stroke="#b45309" stroke-width="1"/>
    <rect x="12" y="12" width="85" height="18" rx="3" fill="#451a03"/>
    <text x="18" y="25" font-size="9.5" font-weight="700" fill="#fbbf24">NICHE CASE</text>
    <text x="12" y="52" font-size="15" font-weight="800" fill="#fef3c7">Build AI Desktop</text>
    <text x="12" y="70" font-size="11" fill="#fed7aa">~$1,700 CapEx Investment</text>
    <line x1="12" y1="80" x2="168" y2="80" stroke="#78350f" stroke-width="0.8"/>
    <text x="12" y="100" font-size="10.5" fill="#e2e8f0">• Used RTX 3090 24GB</text>
    <text x="12" y="118" font-size="10.5" fill="#e2e8f0">• 100% private data</text>
    <text x="12" y="138" font-size="10" fill="#f87171">⚠ Economic Fallacy:</text>
    <text x="12" y="154" font-size="9.5" fill="#fca5a5">Takes 20.1 years to</text>
    <text x="12" y="168" font-size="9.5" fill="#fca5a5">break even vs renting</text>
    <text x="12" y="182" font-size="9.5" fill="#fca5a5">at side-project pace.</text>
  </g>

  <!-- CARD 3: Rent Hourly Cloud GPU (THE 62-CENT SWEET SPOT) -->
  <g transform="translate(540, 402)" filter="url(#nodeShadow)">
    <rect width="320" height="215" rx="12" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
    <rect x="16" y="14" width="130" height="20" rx="4" fill="#0369a1"/>
    <text x="24" y="28" font-size="10" font-weight="800" fill="#e0f2fe">★ THE 62¢ SWEET SPOT</text>
    <text x="16" y="56" font-size="18" font-weight="800" fill="#f0f9ff">Rent Cloud GPU (Vast / RunPod)</text>
    <text x="16" y="74" font-size="12" font-weight="600" fill="#7dd3fc">$0.40 – $0.75 / Hour On-Demand</text>
    <line x1="16" y1="86" x2="304" y2="86" stroke="#0284c7" stroke-width="1"/>
    
    <text x="16" y="108" font-size="11.5" font-weight="600" fill="#f0fdf4">✓ RTX 4090 with 24GB Dedicated GDDR6X</text>
    <text x="16" y="126" font-size="11.5" fill="#e2e8f0">✓ SSH Tunnel to localhost:11435 (Zero pipeline code changes)</text>
    <text x="16" y="144" font-size="11.5" fill="#e2e8f0">✓ Full bake-off active compute cost: only $0.165</text>
    <text x="16" y="162" font-size="11.5" fill="#e2e8f0">✓ 15 GPU-hours/month = only $7.05/month</text>
    <text x="16" y="188" font-size="11" font-weight="700" fill="#38bdf8">Ideal for side projects: Maximum power, near-zero cost.</text>
  </g>

  <!-- CARD 4: Metered Serverless APIs -->
  <g transform="translate(885, 402)" filter="url(#nodeShadow)">
    <rect width="275" height="215" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
    <rect x="14" y="12" width="115" height="18" rx="3" fill="#312e81"/>
    <text x="20" y="25" font-size="9.5" font-weight="700" fill="#c7d2fe">SERVERLESS CLOUD</text>
    <text x="14" y="52" font-size="15" font-weight="800" fill="#e0e7ff">Metered Cloud API</text>
    <text x="14" y="70" font-size="11" fill="#a5b4fc">Gemini Flash / Claude Haiku</text>
    <line x1="14" y1="80" x2="261" y2="80" stroke="#4338ca" stroke-width="0.8"/>
    
    <text x="14" y="102" font-size="11" fill="#e2e8f0">• Pay strictly per token</text>
    <text x="14" y="120" font-size="11" fill="#e2e8f0">• Generous free monthly tiers</text>
    <text x="14" y="138" font-size="11" fill="#e2e8f0">• Zero infrastructure to manage</text>
    <text x="14" y="156" font-size="11" fill="#e2e8f0">• Best for live low-latency UX</text>
    <text x="14" y="182" font-size="10" fill="#fbbf24">⚠ Consumer sub != API key:</text>
    <text x="14" y="196" font-size="9.5" fill="#fed7aa">Requires separate cloud account</text>
  </g>
</svg>